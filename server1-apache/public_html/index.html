<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Secure Application Design</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="container">
      <h1>Secure Application Design</h1>
      <p>Cliente asíncrono servido por Apache sobre TLS.</p>

      <section class="card">
        <h2>Registro</h2>
        <form id="registerForm">
          <input id="registerUsername" type="text" placeholder="Usuario" required />
          <input id="registerPassword" type="password" placeholder="Contraseña" required />
          <button type="submit">Registrar</button>
        </form>
      </section>

      <section class="card">
        <h2>Login</h2>
        <form id="loginForm">
          <input id="loginUsername" type="text" placeholder="Usuario" required />
          <input id="loginPassword" type="password" placeholder="Contraseña" required />
          <button type="submit">Ingresar</button>
        </form>
      </section>

      <section class="card">
        <h2>Endpoint protegido</h2>
        <button id="helloBtn" disabled>Probar /api/hello</button>
      </section>

      <pre id="output"></pre>
    </main>

    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
