spring.application.name=secureapp

server.port=${SERVER_PORT:8443}
server.ssl.enabled=${SERVER_SSL_ENABLED:false}
server.ssl.key-store=${SSL_KEY_STORE:}
server.ssl.key-store-password=${SSL_KEY_STORE_PASSWORD:}
server.ssl.key-store-type=PKCS12

spring.datasource.url=jdbc:h2:mem:secureappdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

security.jwt.secret=${JWT_SECRET:REPLACE_WITH_A_LONG_SECRET_32_BYTES_MINIMUM}
security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
security.cors.allowed-origins=${APP_ORIGINS:https://localhost:8080,http://localhost:8080,https://app.example.com}
